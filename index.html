<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金田一耕助の事件簿帳 // 因習の村と呪われし仕訳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800;900&family=Yuji+Boku&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      /* 横溝正史・金田一耕助の世界観カラーパレット */
      --primary: #801818;           /* どす黒い血潮・血痕 */
      --primary-hover: #5a0e0e;     /* 凝固した古血 */
      --bg-body: #0a0806;           /* 漆黒の夜這い・因習の闇 */
      --bg-gradient: radial-gradient(circle at 50% 15%, #2a1810 0%, #0d0907 65%, #050403 100%);
      --card-bg: #eadecc;           /* 経年劣化した和紙・遺言状・古文書 */
      --card-text: #1a140e;         /* 滲んだ濃墨の文字 */
      --card-shadow: inset 0 0 30px rgba(74, 43, 22, 0.4), 0 8px 25px rgba(0, 0, 0, 0.9);
      --card-watermark: "YOKOMIZO CASE FILE // 昭和二十x年";
      --watermark-color: #8c2424;
      --container-glow: 0 15px 40px rgba(0, 0, 0, 0.95), 0 0 25px rgba(128, 24, 24, 0.4);
      --text-main: #f0e6d6;         /* 蝋燭の光に照らされた白木色 */
      --text-muted: #9c8e7c;        /* 煤けた煙色 */
      --border: #42291a;           /* 朽ちた木枠・格子の色 */
      --debit-border: #8c6239;      /* 古錆・家宝の銅色 */
      --credit-border: #801818;     /* 祟りの朱筆 */
      --correct-bg: #142819;        /* 深い苔・山中の竹藪 */
      --correct-text: #8be09c;      /* 解けた真相の光 */
      --wrong-bg: #380b0b;          /* 惨劇の血溜まり */
      --wrong-text: #f08080;        /* 狂気の叫び */

      --font-main: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-title: "Yuji Boku", "Shippori Mincho", serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      color: var(--text-main);
      background-color: var(--bg-body);
      background-image: var(--bg-gradient);
      padding: 16px;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #14100c;
      color: var(--text-main);
      border: 3px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      box-shadow: var(--container-glow);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 14px;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 2rem; line-height: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
    .logo-title {
      margin: 0;
      font-size: 1.35rem;
      color: #df5353;
      font-weight: 900;
      font-family: var(--font-title);
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .status-badge {
      background: var(--primary);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #df5353;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status-badge.review {
      background: #734b1a;
      border-color: #d4a359;
      color: #fff4db;
    }

    /* 5段階ステージ切り替え */
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    @media (max-width: 540px) {
      .stage-tabs { grid-template-columns: repeat(3, 1fr); }
    }

    .stage-btn {
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #1f1813;
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      font-family: var(--font-main);
      transition: all 0.2s ease;
    }
    .stage-btn:hover { background: #2f241c; color: var(--text-main); }
    .stage-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: #df5353;
      box-shadow: 0 0 10px rgba(128, 24, 24, 0.6);
    }

    .quest-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #19140f;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .progress-track {
      height: 7px;
      width: 100%;
      background: #2b2017;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #df5353);
      transition: width 0.3s ease;
    }

    /* 古文書・遺言状風の問題カード */
    .card {
      background: var(--card-bg) !important;
      color: var(--card-text) !important;
      border: 2px solid #573c29;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow) !important;
      position: relative;
    }
    .card::before {
      content: var(--card-watermark);
      position: absolute;
      top: 6px;
      right: 12px;
      font-size: 0.65rem;
      letter-spacing: 2px;
      font-family: monospace;
      color: var(--watermark-color);
      font-weight: bold;
      opacity: 0.85;
      pointer-events: none;
    }

    .question-label {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 10px;
      font-family: var(--font-title);
      letter-spacing: 1px;
    }

    .story-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.8;
      font-weight: 700;
      color: var(--card-text) !important;
      text-align: justify;
    }

    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }

    .side-column {
      padding: 12px;
      background: #1a140f;
      border: 1.5px solid var(--debit-border);
      border-radius: 8px;
    }
    .side-column.credit { border-color: var(--credit-border); background: #1c1111; }
    .side-title {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #d6c6b2;
    }

    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.92rem;
      background: #0d0a08;
      color: #f7ede1;
      width: 100%;
      font-family: var(--font-main);
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .entry-row input:focus { outline: none; border-color: #df5353; box-shadow: 0 0 5px rgba(223,83,83,0.5); }

    .btn-remove {
      background: #2b0f0f;
      border: 1px solid #631919;
      border-radius: 4px;
      color: #ff9e9e;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      width: 100%;
      padding: 7px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-add:hover { border-color: #df5353; color: #df5353; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid #df5353;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 900;
      font-family: var(--font-title);
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(128, 24, 24, 0.5);
      transition: all 0.2s ease;
    }
    .btn-submit:hover { background: var(--primary-hover); box-shadow: 0 4px 20px rgba(223, 83, 83, 0.6); }

    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .result-box.correct { background: var(--correct-bg); border: 1px solid #235c30; color: var(--correct-text); }
    .result-box.wrong { background: var(--wrong-bg); border: 1px solid #731e1e; color: var(--wrong-text); }

    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 11px;
      background: #211913;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-weight: bold;
      font-family: var(--font-main);
      cursor: pointer;
    }
    .nav-btn:hover { background: #30241b; }

    .clear-card { display: none; text-align: center; padding: 26px 16px; }
    .btn-restart, .btn-review {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-family: var(--font-main);
    }
    .btn-review { background: var(--primary); border-color: #df5353; color: white; }
    .btn-restart { background: #261d16; color: var(--text-main); }

    details {
      margin-top: 22px;
      border-top: 1px dashed var(--border);
      padding-top: 14px;
    }
    summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
    textarea {
      width: 100%;
      height: 90px;
      margin-top: 8px;
      padding: 10px;
      background: #0d0a08;
      color: #f7ede1;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .load-btn {
      width: 100%;
      margin-top: 6px;
      padding: 9px;
      background: #5e1c1c;
      color: white;
      border: 1px solid #8c2e2e;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* 惨劇に震える画面揺れ（不正解演出） */
    .shake-animation {
      animation: horrorShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes horrorShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* 金田一耕助の象徴が舞い上がる正解演出 */
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseCurse ease-out forwards;
    }
    @keyframes riseCurse {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.85; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <!-- ヘッダーエリア：金田一耕助 雀の宿・探偵事務所調 -->
  <div class="header">
    <div class="logo-area">
      <span class="logo-icon" id="app-logo">📜</span>
      <div>
        <h1 class="logo-title" id="app-title">金田一耕助の事件簿帳</h1>
        <div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-main);" id="sub-title">
          〜 昭和因習迷宮と呪われし一族の遺産仕訳 〜
        </div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">🕯️ 捜査中</span>
  </div>

  <!-- 5段階ステージ切り替え幕（犬神家・八つ墓村・獄門島・悪魔の手毬唄・病院坂） -->
  <div class="stage-tabs">
    <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">第一幕<br>犬神家の遺言</button>
    <button type="button" class="stage-btn" id="tab-1" onclick="switchStage(1)">第二幕<br>八つ墓村の血煙</button>
    <button type="button" class="stage-btn" id="tab-2" onclick="switchStage(2)">第三幕<br>獄門島の俳句</button>
    <button type="button" class="stage-btn" id="tab-3" onclick="switchStage(3)">第四幕<br>手毬唄の哀歌</button>
    <button type="button" class="stage-btn" id="tab-4" onclick="switchStage(4)">終　幕<br>首縊りの館</button>
  </div>

  <!-- 捜査進捗ゲージ -->
  <div class="quest-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold; font-family:var(--font-main);">
      <span id="stage-badge-text">🕯️ 第一幕 犬神家の一族・遺言状公開編</span>
      <span id="progress-text">第一節</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- 仕訳出題・入力エリア -->
  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">FILE // 01</div>
      <p class="story-text" id="story-display">事件の記録を紐解いています……</p>
    </div>

    <!-- 借方・貸方 対照表 -->
    <div class="split-container">
      <div class="side-column">
        <div class="side-title">✒️ 借方勘定 (Debit)</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 借方に勘定を記帳</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">🩸 貸方勘定 (Credit)</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 貸方に勘定を記帳</button>
      </div>
    </div>

    <!-- 判定ボタン -->
    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">
      頭を掻きむしって推理する（判定）
    </button>

    <!-- 結果・解説表示枠 -->
    <div id="result-display" class="result-box"></div>

    <!-- ページ送り操作 -->
    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前の記録へ</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次の惨劇へ ▶</button>
    </div>
  </div>

  <!-- 幕（チャプター）完了画面 -->
  <div id="clear-area" class="clear-card">
    <h2 style="color:#df5353; font-family:var(--font-title); letter-spacing:2px; font-size:1.6rem; margin-top:0;">
      🏮 惨劇の真相解明
    </h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.8; color:var(--text-main); font-size:0.95rem;"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshStage()">この幕を最初から検証し直す</button>
  </div>

  <!-- 外部事件記録（JSON）取り込み窓 -->
  <details>
    <summary>📂 外部の事件記録（問題JSON）を取り込む</summary>
    <textarea id="json-input" placeholder="作成したJSON配列をここに貼り付けると、現在の幕を新たな事件で上書きできます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">事件記録を書き換える</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ 帳簿の記憶が乱れた時はここを押してすべて初期化</span>
</div>
<script>
// ==================================================
// ★ 演出絵文字設定：金田一耕助・横溝正史の世界観
// （血痕、蝋燭、菊人形・手毬、斧・琴・菊、卒塔婆、蝙蝠）
// ==================================================
const RISING_EFFECT_SYMBOLS = ["🩸", "🕯️", "🪓", "📜", "🦇", "👘", "🏮", "⚖️"];

// ==================================================
// 内蔵初期問題データ（金田一耕助 5大事件簿・全5幕構成）
// ==================================================
const STAGES = [
  {
    title: "第一幕：犬神家の一族・遺言状と家宝の呪い",
    questions: [
      {
        "story": "製薬王・犬神佐兵衛が遺した家宝「斧（きよき）・琴（こと）・菊（きく）」の鑑定手数料 60,000円を現金で古美術商に支払った。（支払手数料）（現金）",
        "debit": [{ "account": "支払手数料", "amount": 60000 }],
        "credit": [{ "account": "現金", "amount": 60000 }],
        "explanation": "鑑定役務への対価は費用（Expense / 費用）の支払手数料（Commission Expense）として借方に計上し、資産（Asset / 資産）である現金（Cash）の減少を貸方に記帳します。"
      },
      {
        "story": "佐兵衛の血族が争う遺言状の公開立会いに臨むため、古館弁護士事務所から金田一耕助への調査着手金 150,000円が当座預金口座に振り込まれた。（当座預金）（前受金）",
        "debit": [{ "account": "当座預金", "amount": 150000 }],
        "credit": [{ "account": "前受金", "amount": 150000 }],
        "explanation": "調査着手に伴う代金の前受けです。資産（Asset / 資産）の当座預金（Checking Account）の増加を借方に、後日役務を提供する義務である負債（Liability / 負債）の前受金（Advances Received）を貸方に計上します。"
      },
      {
        "story": "那須湖畔で発生した佐清（すけきよ）のゴムマスク偽装事件を受け、湖畔の鑑識・捜査用ボート（備品）300,000円を購入した。代金のうち100,000円は小切手を振り出して支払い、残額は翌月末払いとした。（備品）（当座預金）（未払金）",
        "debit": [{ "account": "備品", "amount": 300000 }],
        "credit": [{ "account": "当座預金", "amount": 100000 }, { "account": "未払金", "amount": 200000 }],
        "explanation": "耐久固定資産の購入に伴う複合仕訳です。資産（Asset / 資産）の備品（Fixtures/Equipment）を借方に計上し、小切手振出による当座預金の減少と、商品以外の後払い義務である負債（Liability / 負債）の未払金（Accounts Payable - other）を貸方に記帳します。"
      }
    ]
  },
  {
    title: "第二幕：八つ墓村・三十二人殺しの血煙",
    questions: [
      {
        "story": "落武者の祟りに怯える多治見家の鍾乳洞を探索するため、強力な懐中電灯と探検用命綱（消耗品費）25,000円を掛けで購入した。（消耗品費）（買掛金）",
        "debit": [{ "account": "消耗品費", "amount": 25000 }],
        "credit": [{ "account": "買掛金", "amount": 25000 }],
        "explanation": "探索用資材の購入は費用（Expense / 費用）の消耗品費（Supplies Expense）を借方に計上し、営業債務である負債（Liability / 負債）の買掛金（Accounts Payable）を貸方に記入します。"
      },
      {
        "story": "多治見要蔵の狂気によって破壊された村の土蔵の白壁と格子戸を修繕し、修繕費用 40,000円を現金で支払った。（修繕費）（現金）",
        "debit": [{ "account": "修繕費", "amount": 40000 }],
        "credit": [{ "account": "現金", "amount": 40000 }],
        "explanation": "建物の原状回復にかかる支出は費用（Expense / 費用）の修繕費（Repairs and Maintenance）を借方に計上し、手許資産（Asset / 資産）の現金（Cash）の減少を貸方に記帳します。"
      },
      {

        "debit": [{ "account": "現金", "amount": 200000 }, { "account": "普通預金", "amount": 300000 }],
        "credit": [{ "account": "固定資産売却益", "amount": 500000 }],
        "explanation": "簿価のない埋蔵財産の換金益です。資産（Asset / 資産）である現金（Cash）と普通預金（Ordinary Deposit）の増加を借方に、臨時の収益（Revenue / 収益）である固定資産売却益（Gain on Sales of Fixed Assets）を貸方に記入する複合仕訳です。"

  },
  {

    questions: [

        "debit": [{ "account": "支払手数料", "amount": 80000 }],
        "credit": [{ "account": "現金", "amount": 80000 }],
        "explanation": "専門職に対する鑑定・検視謝礼は費用（Expense / 費用）の支払手数料（Commission Expense）を借方に計上し、資産（Asset / 資産）の現金（Cash）の減少を貸方に記帳します。"
      },
      {
        "story": "島内の孤立を防ぐため、笠岡港との間を行き来する巡回連絡船のチャーター費用 35,000円を当座預金口座から支払った。（旅費交通費）（当座預金）",
        "debit": [{ "account": "旅費交通費", "amount": 35000 }],
        "credit": [{ "account": "当座預金", "amount": 35000 }],
        "explanation": "海上移動・船のチャーター代は費用（Expense / 費用）の旅費交通費（Traveling Expenses）として借方に計上し、資産（Asset / 資産）である当座預金（Checking Account）の減少を貸方に記帳します。"
      }
    ]
  },
  {
    title: "第四幕：悪魔の手毬唄・鬼首村の哀歌",
    questions: [
      {
        "story": "鬼首村の温泉旅館「亀の湯」の宿泊滞在費および捜査会議室の使用料 55,000円を現金で支払った。（旅費交通費）（現金）",
        "debit": [{ "account": "旅費交通費", "amount": 55000 }],
        "credit": [{ "account": "現金", "amount": 55000 }],
        "explanation": "滞在・出張旅費に伴う宿泊費は費用（Expense / 費用）の旅費交通費（Traveling Expenses）として借方に計上し、資産（Asset / 資産）の現金（Cash）の減少を貸方に記帳します。"
      },
      {
        "story": "人造葡萄（葡萄酒）の醸造所から発見された証拠物件（醸造樽）の買掛金 25,000円を、期日が到来したため当座預金から送金して精算した。（買掛金）（当座預金）",
        "debit": [{ "account": "買掛金", "amount": 25000 }],
        "credit": [{ "account": "当座預金", "amount": 25000 }],
        "explanation": "仕入債務の弁済です。負債（Liability / 負債）の買掛金（Accounts Payable）を借方に減額し、資産（Asset / 資産）である当座預金（Checking Account）の減少を貸方に記帳します。"
      }
    ]
  },
  {
    title: "終　幕：病院坂の首縊りの館・終焉の決算",
    questions: [
      {
        "story": "首縊りの館となった法眼病院跡地の敷地調査資料を新聞社に独占提供し、情報提供料 400,000円の受領が確定した。代金のうち150,000円は現金で受け取り、残額 250,000円は来月末の受取手形として受け取った。（現金）（受取手形）（受取手数料）",
        "debit": [{ "account": "現金", "amount": 150000 }, { "account": "受取手形", "amount": 250000 }],
        "credit": [{ "account": "受取手数料", "amount": 400000 }],
        "explanation": "役務提供の対価を複数資産で受け取る複合仕訳です。資産（Asset / 資産）の現金（Cash）と受取手形（Notes Receivable）を借方に計上し、収益（Revenue / 収益）の受取手数料（Commission Received）を貸方に記入します。"
      },
      {
        "story": "決算を迎え、数々の惨劇の現場を駆け抜けた金田一耕助のおんぼろ自転車および調査備品（取得原価 120,000円）について、定額法による当期の減価償却費 20,000円を間接法で計上した。（減価償却費）（減価償却累計額）",
        "debit": [{ "account": "減価償却費", "amount": 20000 }],
        "credit": [{ "account": "減価償却累計額", "amount": 20000 }],
        "explanation": "固定資産の減耗を見積もる決算整理仕訳です。費用（Expense / 費用）の減価償却費（Depreciation Expense）を借方に計上し、資産のマイナスを表す評価勘定（Contra-Asset）の減価償却累計額（Accumulated Depreciation）を貸方に記帳します。"
      }
    ]
  }
];

// ==================================================
// アプリ共通ロジック（進行管理・判定・演出）
// ==================================================
let currentStageIndex = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  const savedStage = localStorage.getItem("kindaichi_boki_stage");
  currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
  if (currentStageIndex < 0 || currentStageIndex >= STAGES.length) currentStageIndex = 0;
  loadStage(currentStageIndex);
}

function switchStage(stageIdx) {
  if (stageIdx === currentStageIndex && !isReviewMode) return;
  loadStage(stageIdx);
}

function loadStage(stageIdx) {
  currentStageIndex = stageIdx;
  localStorage.setItem("kindaichi_boki_stage", currentStageIndex);

  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (btn) {
      if (i === stageIdx) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }

  const stageObj = STAGES[stageIdx];
  document.getElementById("stage-badge-text").textContent = `🕯️ ${stageObj.title}`;
  document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

  const keyPrefix = `kindaichi_st${stageIdx}_`;
  let stageData = stageObj.questions;
  try {
    const customData = localStorage.getItem(`${keyPrefix}data`);
    if (customData) {
      const parsed = JSON.parse(customData);
      if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
    }
  } catch(e) {}

  currentQuestions = [...stageData];
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  isReviewMode = false;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="勘定科目" value="${account}">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行の記帳欄が必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 迷宮の反芻";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "🕯️ 捜査中";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "再検証" : `第 ${currentStageIndex + 1} 幕`;
  document.getElementById("q-number").textContent = `${prefix} // 第 ${index + 1} 節 (全 ${currentQuestions.length} 節)`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "真相の総括へ 🏮" : "次の惨劇へ ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `第 ${index + 1} 節 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

function spawnRisingMagic() {
  const totalItems = 26;
  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = RISING_EFFECT_SYMBOLS[Math.floor(Math.random() * RISING_EFFECT_SYMBOLS.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 16 + 20;
    const duration = Math.random() * 1.5 + 2.0;
    const delay = Math.random() * 0.4;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);
    setTimeout(() => { item.remove(); }, (duration + delay) * 1000);
  }
}

function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");
  setTimeout(() => { container.classList.remove("shake-animation"); }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnRisingMagic();
    res.className = "result-box correct";
    res.innerHTML = `<strong>「よし、わかった！仕訳の糸口が解けましたよ！」</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    res.innerHTML = `<strong>「いやはや、まだ思い違いをしているようだ……」</strong><br>真の借方: ${dStr}<br>真の貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div style="display:inline-block; padding:8px 16px; background:#142819; border:1px solid #235c30; border-radius:4px; font-weight:bold; color:#8be09c; margin-bottom:14px; letter-spacing:1px;">🏆 この幕の謎を完全に看破した</div>`;
    scoreText.innerHTML = `全節正解。複雑怪奇な因習の帳簿を見事に紐解き、真相へ到達しました。（${total} / ${total} 節）`;
  } else {
    scoreText.innerHTML = `${total} 節中 ${correctCount} 節 究明。<br>まだ闇に葬られた疑問（誤答）が ${wrongList.length} 節 残されています。`;
    const btn = document.createElement("button");
    btn.className = "btn-review";
    btn.textContent = `🔄 疑問の残る節を検証し直す (${wrongList.length}節)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshStage() {
  loadStage(currentStageIndex);
}

function forceReset() {
  if (confirm("記録されたすべての捜査帳簿を初期化し、原点に戻しますか？")) {
    localStorage.clear();
    location.reload();
  }
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("事件のJSONデータを入力してください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    STAGES[currentStageIndex].questions = data;
    localStorage.setItem(`kindaichi_st${currentStageIndex}_data`, JSON.stringify(data));
    loadStage(currentStageIndex);
    alert(`第 ${currentStageIndex + 1} 幕の事件記録（全 ${data.length} 節）を更新しました！`);
  } catch (e) {
    alert("⚠️ JSONの形式を確認してください。正しく貼り付けられているかチェックをお願いします。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
